<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISwiftCoder | Login</title>
    <link rel="stylesheet" href="styles.css" />
</head>


<body>

    <!-- Header -->
    <header class="header">
        <h1 class="game-title">ISWIFTCODER</h1>
        <p class="game-subtitle">Compile at the speed of thought</p>
    </header>

    <!-- Main wrapper -->
    <main class="main-wrapper">
        <section class="Reg-form">
            <h2 class="Reg-form-title">Login</h2>

            <!-- Email -->
            <label class="field-label">Email</label>
            <div class="email-group">
                <input type="text" placeholder="username" />
                <select>
                    <option value="@karunya.edu.in">@karunya.edu.in</option>
                    <option value="@karunya.edu">@karunya.edu</option>
                </select>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password" />
            </div>

            <button class="btn-primary">Login</button>

            <div class="form-footer">
                <span>Don’t have an account?</span>
                <a href="#">Register</a>
            </div>
        </section>
    </main>
<script src="Login.js"></script>
</body>
</html>
