<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Offline C Runner + Monaco</title>
  <link rel="stylesheet" 
    data-name="vs/editor/editor.main" 
    href="https://unpkg.com/monaco-editor@0.34.0/min/vs/editor/editor.main.css"
  />
<script>
</script>
  <style>
    body { background: #1e1e1e; color: #fff; font-family: Arial; padding: 20px; }
    #editor { width: 100%; height: 400px; border: 1px solid #444; }
    #runBtn { padding: 10px 18px; margin-top: 10px; font-size: 16px; }
    #output { background: #242424; padding: 10px; margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>

<body>
  <h2>C Runner with Monaco Editor</h2>

  <div id="editor"></div>
  <button id="runBtn">Run Code</button>
  <pre id="output">Output here...</pre>

  <script>
    var require = {
      paths: {
        vs: "https://unpkg.com/monaco-editor@0.34.0/min/vs",
      },
    };
  </script>

  <script src="https://unpkg.com/monaco-editor@0.34.0/min/vs/loader.js"></script>
  <script src="https://unpkg.com/monaco-editor@0.34.0/min/vs/editor/editor.main.nls.js"></script>
  <script src="https://unpkg.com/monaco-editor@0.34.0/min/vs/editor/editor.main.js"></script>

  <script>
    require(["vs/editor/editor.main"], () => {
      const editor = monaco.editor.create(document.getElementById("editor"), {
        value: `#include <stdio.h>

int main() {
    
    return 0;
}`,
        language: "c",
        theme: "vs-dark"
      });

      document.getElementById("runBtn").onclick = () => {
        const code = editor.getValue();
        document.getElementById("output").textContent = "Compiling...";

        fetch("/run", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ code })
        })
        .then(res => res.text())
        .then(out => {
          document.getElementById("output").textContent = out;
        });
      };
    });
  </script>

</body>
</html>
