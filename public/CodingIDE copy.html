<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>iSwiftCoder</title>
    <link rel="icon" href="logo.png">

    <!-- Monaco Editor CSS -->
    <link rel="stylesheet" data-name="vs/editor/editor.main"
        href="https://unpkg.com/monaco-editor@0.34.0/min/vs/editor/editor.main.css" />

    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            font-family: "Segoe UI", sans-serif;
            overflow: hidden;
        }

        /* Toolbar */
        #toolbar {
            width: 100%;
            height: 50px;
            background: #2d2d30;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #3c3c3c;
        }

        .Btn {
            background: #0e639c;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .Btn:hover {
            background: #1177bb;
        }

        /* Split Layout */
        #main {
            display: flex;
            height: calc(100vh - 50px);
            width: 100%;
        }

        #editor {
            flex: 2;
            border-right: 1px solid #333;
        }

        #outputContainer {
            flex: 1;
            background: #1b1b1b;
            display: flex;
            flex-direction: column;
        }

        #outputTitle {
            padding: 10px;
            background: #252526;
            border-bottom: 1px solid #333;
            font-size: 14px;
            font-weight: bold;
            color: #ccc;
        }

        #output {
            flex: 1;
            padding: 10px;
            color: white;
            background: #242424;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: "Consolas", monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>

<body>

    <!-- Toolbar -->
    <div id="toolbar">
        <button id="runBtn" class="Btn">▶ Run</button>
        &emsp;&emsp;
        <button id="resetBtn" class="Btn">↻ Reset</button>
    </div>

    <!-- Main layout -->
    <div id="main">
        <div id="editor"></div>

        <div id="outputContainer">
            <div id="outputTitle">OUTPUT</div>
            <pre id="output">Nothing</pre>
        </div>
    </div>

    <script>
        var require = { paths: { vs: "https://unpkg.com/monaco-editor@0.34.0/min/vs" } };
    </script>

    <script src="https://unpkg.com/monaco-editor@0.34.0/min/vs/loader.js"></script>
    <script src="https://unpkg.com/monaco-editor@0.34.0/min/vs/editor/editor.main.nls.js"></script>
    <script src="https://unpkg.com/monaco-editor@0.34.0/min/vs/editor/editor.main.js"></script>
    <script src="IDE.js"></script>

</body>

</html>
